{% verbatim %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>محور طريق الأمير محمد بن سلمان — أصول المحور</title>
  <link rel="icon" href="/static/img/favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/leaflet.css" />
  <link rel="stylesheet" href="/static/css/styles.css?v=13" />
  <script>
    window.addEventListener("error", function (e) {
      alert("Error: " + e.message + " at " + e.filename + ":" + e.lineno);
    });
    window.addEventListener("unhandledrejection", function (e) {
      alert("Unhandled Promise Rejection: " + e.reason);
    });
  </script>
</head>
<body>
<div id="app" v-cloak>
  <header class="topbar">
    <div class="brand-lockup">
      <img src="/static/img/logo.png" alt="أمانة العاصمة المقدسة" />
      <div class="divider"></div>
      <div class="dept">إدارة أصول النقل والبنية التحتية</div>
    </div>
    <div class="title-block">
      <h1>محور طريق الأمير محمد بن سلمان</h1>
    </div>
    <div class="spacer"></div>
    <div style="display: flex; gap: 8px;">
      <a class="btn primary" href="/axis/">🛣️ أصول المحور</a>
      <a class="btn" href="/" style="background: rgba(255,255,255,0.1); color: #fff;">⚠️ الحالات</a>
      <a class="btn" href="/projects/" style="background: rgba(255,255,255,0.1); color: #fff;">🏗️ العقود الحالية</a>
      <a class="btn" href="/projects-2028/" style="background: rgba(255,255,255,0.1); color: #fff;">🚀 العقود الجديدة 2028</a>
    </div>
  </header>

  <div id="map"></div>
  <div class="loading" v-if="loading">جارٍ تحميل البيانات…</div>

  <button class="filter-toggle-btn" v-show="!filterOpen" @click="filterOpen = true">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
    <span>الفلاتر</span>
  </button>

  <div class="filter-panel axis-page-panel" v-show="filterOpen">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
      <span style="font-size: 14px; font-weight: 800; color: #fff;">أصول المحور</span>
      <button class="close-filter-btn" @click="filterOpen = false">✕</button>
    </div>
    <div class="chip-group">
      <span class="chip-label">الشارع</span>
      <div class="chips">
        <button class="chip" :class="{active: aStreet===''}" @click="aStreet=''">الكل</button>
        <button class="chip" :class="{active: aStreet==='طريق الحرمين'}" style="--chip:#f59e0b" @click="aStreet = aStreet==='طريق الحرمين' ? '' : 'طريق الحرمين'"><i class="dot"></i>طريق الحرمين</button>
        <button class="chip" :class="{active: aStreet==='طريق جدة_مكة'}" style="--chip:#38bdf8" @click="aStreet = aStreet==='طريق جدة_مكة' ? '' : 'طريق جدة_مكة'"><i class="dot"></i>طريق جدة_مكة</button>
        <button class="chip" :class="{active: aStreet==='طريق الفلاح'}" style="--chip:#a78bfa" @click="aStreet = aStreet==='طريق الفلاح' ? '' : 'طريق الفلاح'"><i class="dot"></i>طريق الفلاح</button>
      </div>
    </div>
    <div class="filter-field">
      <label>البلدية</label>
      <select v-model="aMunicipality">
        <option value="">الكل</option>
        <option v-for="m in axisMunicipalities" :key="m" :value="m">{{ m }}</option>
      </select>
    </div>
    <div class="filter-field">
      <label>الحي</label>
      <select v-model="aDistrict">
        <option value="">الكل</option>
        <option v-for="d in axisDistricts" :key="d" :value="d">{{ d }}</option>
      </select>
    </div>
    <div class="chip-group">
      <span class="chip-label">الاتجاه</span>
      <div class="chips">
        <button class="chip" :class="{active: aDirection===''}" @click="aDirection=''">الكل</button>
        <button class="chip" :class="{active: aDirection==='S'}" style="--chip:#34d399" @click="aDirection = aDirection==='S' ? '' : 'S'"><i class="dot"></i>جنوب</button>
        <button class="chip" :class="{active: aDirection==='N'}" style="--chip:#60a5fa" @click="aDirection = aDirection==='N' ? '' : 'N'"><i class="dot"></i>شمال</button>
        <button class="chip" :class="{active: aDirection==='E'}" style="--chip:#f472b6" @click="aDirection = aDirection==='E' ? '' : 'E'"><i class="dot"></i>شرق</button>
        <button class="chip" :class="{active: aDirection==='W'}" style="--chip:#fbbf24" @click="aDirection = aDirection==='W' ? '' : 'W'"><i class="dot"></i>غرب</button>
      </div>
    </div>
    <div class="filter-actions">
      <button class="count-chip" @click="zoomToAxis" title="تقريب على المقاطع المعروضة">
        <span>المقاطع</span>
        <b>{{ visibleAxisCount }}</b>
        <small>🔍</small>
      </button>
      <button class="dash-btn axis-reset-btn" @click="resetAxisFilters">↺ إعادة ضبط</button>
    </div>
  </div>
</div>

<script src="/static/js/leaflet.js"></script>
<script src="/static/js/vue.global.prod.js"></script>
<script src="/static/js/axis.js?v=1"></script>
</body>
</html>
{% endverbatim %}
